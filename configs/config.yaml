# =============================================================================
# configs/config.yaml — OCR Benchmark Framework
# All configuration values. Nothing is hardcoded in the Python source.
# =============================================================================

# -----------------------------------------------------------------------------
# Paths (inside Docker container; override via environment variables)
# -----------------------------------------------------------------------------
paths:
  images_dir: ./images
  annotations_dir: ./annotations
  # Parent dir for OCR output; each engine writes to its own subdirectory:
  #   ocr_output/paddle/     ← PaddleOCR JSONs
  #   ocr_output/tesseract/  ← Tesseract JSONs
  ocr_output_dir: ./ocr_output
  # results.csv and results_summary.md are written directly to ./ (project root)
  results_dir: ./
  reports_dir: ./reports
  logs_dir: ./logs
  paddle_model_dir: ./paddle-models

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: INFO                     # DEBUG | INFO | WARNING | ERROR | CRITICAL
  max_bytes: 10485760             # 10 MB per log file before rotation
  backup_count: 5                 # Number of rotated files to keep
  files:
    application: application.log
    ocr: ocr.log
    errors: errors.log

# -----------------------------------------------------------------------------
# OCR Engines
# -----------------------------------------------------------------------------
engines:
  paddle:
    lang: ch                      # PaddleOCR lang code: 'ch' works for multi-lang
    use_angle_cls: true           # Detect rotated text
    use_gpu: false                # CPU-only
    det_db_thresh: 0.3            # Detection threshold
    det_db_box_thresh: 0.6        # Box score threshold
    rec_batch_num: 6              # Recognition batch size
    enable_mkldnn: false          # Disable MKL-DNN for compatibility
    show_log: false               # Suppress PaddleOCR internal logs
    cls_thresh: 0.9

  tesseract:
    lang: fra+eng                 # ISO 639-2: fra = French, eng = English
    # Page segmentation modes:
    #   3  = Fully automatic page segmentation (default)
    #   6  = Assume a single uniform block of text
    #   11 = Sparse text — find as much text as possible
    psm: 3
    oem: 3                        # OCR Engine Mode: 3 = LSTM only
    config_extra: ""              # Additional tesseract config flags
    dpi: 300                      # DPI hint for Tesseract

# -----------------------------------------------------------------------------
# Matching
# -----------------------------------------------------------------------------
matching:
  iou_threshold: 0.5             # Minimum IoU to consider a spatial match
  text_similarity_threshold: 0.8 # Minimum char-level similarity (0-1)
  # Strategy: 'iou_only' | 'iou_and_text' | 'text_only'
  strategy: iou_and_text

# -----------------------------------------------------------------------------
# Scoring
# -----------------------------------------------------------------------------
scoring:
  # Metrics to compute (all enabled by default)
  metrics:
    - precision
    - recall
    - f1
    - coverage
    - false_positives
    - false_negatives
    - missed_words
    - invented_words

# -----------------------------------------------------------------------------
# Reports
# -----------------------------------------------------------------------------
reports:
  formats:
    - csv
    - json
    - markdown
  # Include per-image breakdown in reports
  include_per_image: true
  # Include word-level details (can make files large)
  include_word_detail: false
  # Markdown template (relative to project root)
  markdown_template: null          # null = use built-in default

# -----------------------------------------------------------------------------
# Image Preprocessing
# -----------------------------------------------------------------------------
preprocessing:
  # Apply before passing to OCR engines
  enabled: true
  # Resize long edge to this value (None = no resize)
  max_long_edge: 4096
  # Convert to grayscale before passing to Tesseract
  tesseract_grayscale: true
  # DPI for TIFF/PDF inputs (if applicable)
  default_dpi: 300

# -----------------------------------------------------------------------------
# Label Studio Integration
# -----------------------------------------------------------------------------
label_studio:
  url: http://labelstudio:8080
  # API key loaded from LABEL_STUDIO_API_KEY env var at runtime
  project_id: 1
  # Export format from Label Studio
  export_format: JSON
  # Annotation result type to use for OCR ground truth
  result_type: rectanglelabels   # or 'polygonlabels'
